name: "CodeQL"

on:
  # 매주 수요일 오전 9시 (KST) 정기 스캔
  schedule:
    - cron: '0 0 * * 3'  # UTC 00:00 수요일 = KST 09:00

  # PR에서 코드 변경 시
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'web/**'

  # 수동 실행
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL 분석
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: CodeQL 초기화
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 추가 쿼리 실행 (보안 + 품질)
          queries: +security-and-quality

      - name: 자동 빌드
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL 분석 실행
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
